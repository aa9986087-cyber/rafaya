<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2a1d12">
  <meta name="description" content="الرافعية: لعبة محاكاة ثلاثية الأبعاد تبني فيها قريتك وتكبّرها من خيمة إلى محافظة.">
  <title>الرافعية</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Reem+Kufi:wght@600;700&family=Tajawal:wght@500;700;800&display=swap">
  <link rel="stylesheet" href="css/style.css?v=2">
  <script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js", "three/addons/": "./vendor/jsm/" } }</script>
</head>
<body class="at-menu">
  <canvas id="map" aria-label="خريطة الرافعية"></canvas>

  <!-- Main menu over the live town -->
  <section id="menu" class="menu" aria-label="القائمة الرئيسية">
    <div class="menu-top">
      <p class="menu-eyebrow">لعبة محاكاة</p>
      <h1 class="menu-title">الرافعية</h1>
      <p class="menu-sub">من خيمة في الوادي… إلى محافظة</p>
    </div>
    <div class="menu-actions">
      <button id="mContinue" class="mbtn primary" type="button" hidden><b>كمّل مدينتك</b><small id="mContinueInfo"></small></button>
      <button id="mNew" class="mbtn" type="button"><b>لعبة جديدة</b><small>ابدأ من ثلاث خيام وبئر</small></button>
      <button id="mWorld" class="mbtn world" type="button"><b>🌍 عالم الجوف</b><small>أونلاين: مدينتك بين مدن اللاعبين على خريطة الجوف</small></button>
      <button id="mWhatsNew" class="mbtn news" type="button"><b>🆕 وش الجديد في التحديث؟</b><small>المدن، المرور، السدود، أهل الرافعية، والأونلاين</small></button>
      <div class="mrow">
        <button id="mHow" class="mbtn small" type="button">طريقة اللعب</button>
        <button id="mSettings" class="mbtn small" type="button">الإعدادات</button>
      </div>
      <p class="menu-credit">صُنعت في الرافعية بيد <b dir="ltr">Vamos</b></p>
    </div>
  </section>

  <div id="game" class="game">
    <header class="hud">
      <div class="stats">
        <button class="stat money" id="statMoney" type="button"><span>الميزانية</span><b id="sMoney"></b><small id="sNet"></small></button>
        <button class="stat" id="statPop" type="button"><span>السكان</span><b id="sPop"></b><small id="sGrow"></small></button>
        <button class="stat" id="statHappy" type="button"><span>الرضا</span><b id="sHappy"></b><i class="face" id="sFace"></i></button>
        <button class="stat util" id="statUtil" type="button"><span>ماء</span><i class="bar"><i id="sWater"></i></i><span id="sPowerLabel">كهرباء</span><i class="bar"><i id="sPower"></i></i></button>
      </div>
      <div class="timebar">
        <div class="when"><div class="when-top"><b id="sEra"></b><span id="sDay"></span><span id="sTime" class="time"></span></div><div class="when-season"><span id="sSeason"></span><i class="bar"><i id="sSeasonBar"></i></i></div></div>
        <div class="speeds" role="group" aria-label="سرعة الوقت">
          <button type="button" data-speed="0" aria-label="إيقاف"><svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg></button>
          <button type="button" data-speed="1" aria-label="عادي"><svg viewBox="0 0 24 24"><path d="M8 5l10 7-10 7z"/></svg></button>
          <button type="button" data-speed="5" aria-label="سريع"><svg viewBox="0 0 24 24"><path d="M4 5l8 7-8 7zM12 5l8 7-8 7z"/></svg></button>
        </div>
      </div>
      <button id="goal" class="goal" type="button"></button>
      <div id="event" class="event" hidden></div>
    </header>

    <div class="side">
      <button id="councilBtn" class="side-btn" type="button"><svg viewBox="0 0 24 24"><path d="M3 10h18L12 4 3 10Z"/><path d="M5 10v8M9.5 10v8M14.5 10v8M19 10v8M3 20h18"/></svg><span>المجلس</span><i class="dot" id="councilDot" hidden></i></button>
      <button id="budgetBtn" class="side-btn" type="button"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>الأرقام</span></button>
      <button id="newsBtn" class="side-btn" type="button"><svg viewBox="0 0 24 24"><path d="M4 5h13v14H6a2 2 0 0 1-2-2z"/><path d="M17 9h3v8a2 2 0 0 1-2 2M7 9h7M7 12h7M7 15h4"/></svg><span>النشرة</span><i class="count" id="newsCount" hidden></i></button>
      <button id="worldBtn" class="side-btn" type="button"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9s1.3-6.4 3.8-9z"/></svg><span>الجوف</span></button>
      <button id="warBtn" class="side-btn world-only" type="button"><svg viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 4.5-3 8.2-7 10-4-1.8-7-5.5-7-10V6z"/><path d="M9 12l2 2 4-4"/></svg><span>القيادة</span><i class="dot" id="warDot" hidden></i></button>
      <button id="deputyBtn" class="side-btn world-only" type="button"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-3.9 3.1-7 7-7s7 3.1 7 7"/><path d="M12 13l-1.5 3 1.5 4 1.5-4z"/></svg><span>النائب</span></button>
      <button id="turnBtn" class="side-btn" type="button"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v5h-5"/></svg><span>لفّ</span></button>
      <button id="pauseMenuBtn" class="side-btn" type="button"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg><span>القائمة</span></button>
    </div>

    <div id="floaters" class="floaters" aria-hidden="true"></div>
    <div id="warAlert" class="war-alert" hidden></div>
    <div id="targetBar" class="target-bar" hidden></div>
    <div id="warScene" class="war-scene-ui" hidden>
      <div id="warBanner" class="war-banner" hidden></div>
      <div id="warMap" class="war-map" hidden></div>
      <button id="warSkip" class="btn war-skip" type="button">⏭ تخطي</button>
    </div>
    <div id="visitBar" class="visit-bar" hidden><span>👀 تزور <b id="visitName"></b><small id="visitMayor"></small></span><button id="visitComments" class="btn" type="button">💬</button><button id="visitBack" class="btn go" type="button">رجوع لمدينتي</button></div>
    <div id="followTag" class="follow-tag" hidden><span><b id="followName"></b><small id="followWhat"></small></span><button id="followStop" type="button" aria-label="وقف المتابعة">✕</button></div>
    <div id="toolChip" class="tool-chip" hidden><span id="toolName"></span><button id="toolRot" class="rot" type="button" hidden aria-label="لفّ المبنى">↻</button><button id="toolOk" class="ok" type="button" hidden>✓ ابنِ</button><button id="toolCancel" type="button" aria-label="إلغاء">✕</button></div>

    <div id="arrange" class="arrange" hidden>
      <div id="arrTray" class="arr-tray"></div>
      <div class="arr-tip" id="arrTip">اضغط على مبنى عشان تختاره، بعدها اسحبه بإصبعك لمكانه. حطه على مبنى ثاني ويتبادلون مكانهم.</div>
      <div class="arr-bar">
        <button id="arrRot" type="button">↻<small>لفّ</small></button>
        <button id="arrAll" type="button">📦<small>شيل الكل</small></button>
        <button id="arrUndo" type="button">↶<small>تراجع</small></button>
        <button id="arrCancel" type="button">✕<small>إلغاء</small></button>
        <button id="arrSave" class="go" type="button">✓<small>احفظ</small></button>
      </div>
    </div>
    <footer class="dock">
      <div id="cards" class="cards" hidden></div>
      <nav class="cats" id="cats" aria-label="البناء"></nav>
    </footer>
  </div>

  <div id="sheet" class="sheet" hidden>
    <div class="sheet-box">
      <button id="sheetClose" class="sheet-close" type="button" aria-label="إغلاق">✕</button>
      <div id="sheetBody"></div>
    </div>
  </div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="loading" class="loading"><b>الرافعية</b><span>نجهّز الوادي…</span></div>

  <script type="module" src="js/main.js?v=2"></script>
</body>
</html>
