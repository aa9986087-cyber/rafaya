<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#3b2a1a">
  <meta name="description" content="الرافعية: لعبة محاكاة تبني فيها قريتك وتكبّرها لين تصير محافظة.">
  <title>الرافعية</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@600;700&family=Tajawal:wght@500;700;800&display=swap">
  <link rel="stylesheet" href="css/style.css?v=1">
</head>
<body>
  <canvas id="map" aria-label="خريطة الرافعية"></canvas>

  <header class="hud">
    <div class="stats">
      <div class="stat money"><span>الميزانية</span><b id="sMoney"></b><small id="sNet"></small></div>
      <div class="stat"><span>السكان</span><b id="sPop"></b><small id="sGrow"></small></div>
      <div class="stat"><span>الرضا</span><b id="sHappy"></b></div>
      <div class="stat util"><span>ماء</span><i class="bar"><i id="sWater"></i></i><span>كهرباء</span><i class="bar"><i id="sPower"></i></i></div>
    </div>
    <div class="timebar">
      <div class="when"><b id="sEra"></b><span id="sDay"></span></div>
      <div class="speeds" role="group" aria-label="سرعة الوقت">
        <button type="button" data-speed="0" aria-label="إيقاف">❚❚</button>
        <button type="button" data-speed="1" aria-label="عادي">▶</button>
        <button type="button" data-speed="2" aria-label="سريع">▶▶</button>
        <button type="button" data-speed="4" aria-label="أسرع">▶▶▶</button>
      </div>
    </div>
    <button id="goal" class="goal" type="button"></button>
    <div id="event" class="event" hidden></div>
  </header>

  <div class="side">
    <button id="councilBtn" class="side-btn" type="button"><svg viewBox="0 0 24 24"><path d="M3 10h18L12 4 3 10Z"/><path d="M5 10v8M9.5 10v8M14.5 10v8M19 10v8M3 20h18"/></svg>المجلس</button>
    <button id="budgetBtn" class="side-btn" type="button"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>الميزانية</button>
    <button id="menuBtn" class="side-btn" type="button"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>القائمة</button>
  </div>

  <div id="toolChip" class="tool-chip" hidden><span id="toolName"></span><button id="toolCancel" type="button" aria-label="إلغاء">✕</button></div>

  <footer class="dock">
    <div id="cards" class="cards" hidden></div>
    <nav class="cats" id="cats" aria-label="البناء"></nav>
  </footer>

  <div id="sheet" class="sheet" hidden>
    <div class="sheet-box">
      <button id="sheetClose" class="sheet-close" type="button" aria-label="إغلاق">✕</button>
      <div id="sheetBody"></div>
    </div>
  </div>
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script type="module" src="js/main.js?v=1"></script>
</body>
</html>
