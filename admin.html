<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>لوحة تحكم الجوف</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  :root { --paper: #fbf3e4; --card: #f3e6cc; --ink: #2a1d12; --muted: #7a6650; --teal: #2c8a7a; --red: #c0412f; --green: #1d6b45; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, "Segoe UI", Tahoma, sans-serif; background: var(--paper); color: var(--ink); }
  header { position: sticky; top: 0; z-index: 2; background: #2a1d12; color: #f3d9a0; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; }
  header h1 { margin: 0; font-size: 18px; }
  header button { background: none; border: 1px solid #6b5338; color: #f3d9a0; border-radius: 10px; padding: 6px 10px; font: inherit; }
  nav { display: flex; gap: 6px; overflow-x: auto; padding: 10px 16px; background: var(--card); position: sticky; top: 50px; z-index: 1; }
  nav button { flex: none; border: 0; border-radius: 999px; padding: 8px 14px; background: #fff7e8; color: var(--ink); font: inherit; font-weight: 700; }
  nav button.on { background: var(--teal); color: #fff; }
  main { padding: 16px; max-width: 720px; margin: 0 auto; }
  .card { background: #fff7e8; border-radius: 14px; padding: 12px; margin: 0 0 10px; box-shadow: 0 2px 0 #e7d6b4; }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .stat b { display: block; font-size: 26px; }
  .stat span { color: var(--muted); font-size: 13px; }
  .row { display: flex; gap: 8px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
  small, .muted { color: var(--muted); }
  input, textarea { width: 100%; font: inherit; padding: 10px; border-radius: 10px; border: 1px solid #d9c6a3; background: #fffdf7; }
  textarea { min-height: 80px; }
  .btn { border: 0; border-radius: 10px; padding: 9px 12px; font: inherit; font-weight: 700; background: var(--card); color: var(--ink); }
  .btn.go { background: var(--teal); color: #fff; }
  .btn.bad { background: var(--red); color: #fff; }
  .btn.block { width: 100%; margin-top: 8px; }
  .tag { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: #fde8e4; color: var(--red); }
  .tag.ok { background: #e6f4ec; color: var(--green); }
  #toast { position: fixed; bottom: 16px; inset-inline: 16px; background: #2a1d12; color: #fff; padding: 12px; border-radius: 12px; text-align: center; display: none; }
  .login { max-width: 360px; margin: 60px auto; text-align: center; }
  .acts { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .feedback-text { margin: 8px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  #stmt { position: fixed; inset: 0; z-index: 9; background: #fff; overflow: auto; padding: 16px; display: none; }
  #stmt table { width: 100%; border-collapse: collapse; font-size: 13px; margin: 6px 0 14px; }
  #stmt th, #stmt td { border-bottom: 1px solid #e3d6bd; padding: 6px 4px; text-align: start; vertical-align: top; }
  #stmt th { background: #f3e6cc; }
  #stmt .plus { color: var(--green); font-weight: 700; } #stmt .minus { color: var(--red); font-weight: 700; }
  #stmt h2 { margin: 0 0 4px; } #stmt h3 { margin: 14px 0 4px; }
  @media print { body > *:not(#stmt) { display: none !important; } #stmt { position: static; display: block !important; padding: 0; } #stmt .noprint { display: none; } }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<div id="stmt"></div>
<script>
// The owner's control panel for al-Jouf: /api/admin/* with the token from logging in (kept on this phone).
const $ = (id) => document.getElementById(id);
const n = (v) => Number(v || 0).toLocaleString("ar-SA");
const esc = (t) => String(t ?? "").replace(/[<>&"]/g, (c) => ({ "<": "&lt;", ">": "&gt;", "&": "&amp;", '"': "&quot;" })[c]);
const ago = (at) => { const m = Math.round((Date.now() - at) / 60000); return m < 1 ? "الحين" : m < 60 ? `قبل ${n(m)} د` : m < 1440 ? `قبل ${n(Math.round(m / 60))} س` : `قبل ${n(Math.round(m / 1440))} يوم`; };
const ERAS = ["قرية", "بلدة", "مدينة", "محافظة", "حاضرة"];
let token = localStorage.getItem("rafaya-admin") || "", tab = "home", lastQ = ""; // lastQ: the players search stays after an action
function toast(t) { const el = $("toast"); el.textContent = t; el.style.display = "block"; clearTimeout(toast.t); toast.t = setTimeout(() => { el.style.display = "none"; }, 2500); }
async function api(path, body) {
  const r = await fetch("/api/admin/" + path, { method: body ? "POST" : "GET", headers: { "content-type": "application/json", "x-admin": token }, body: body ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401) { token = ""; localStorage.removeItem("rafaya-admin"); login(); throw new Error("login"); }
  return j;
}
function login() {
  $("app").innerHTML = `<div class="login card"><h2>🛠️ لوحة تحكم الجوف</h2><p class="muted">اكتب الرمز السري حقك</p>
    <input id="code" placeholder="XXXX-XXXX-XXXX" autocomplete="off" style="text-align:center;letter-spacing:2px;text-transform:uppercase">
    <button class="btn go block" id="go">دخول</button></div>`;
  $("go").onclick = async () => {
    const r = await fetch("/api/admin/login", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ code: $("code").value }) }).then((x) => x.json()).catch(() => ({ error: "ما زبط" }));
    if (!r.token) { toast(r.error || "الرمز غلط"); return; }
    token = r.token; localStorage.setItem("rafaya-admin", token); show();
  };
}
const TABS = [["home", "📊 نظرة عامة"], ["review", "🔑 وصول للمراجعة"], ["reports", "🚩 البلاغات"], ["chat", "💬 الشات"], ["feedback", "🔒 ملاحظات اللاعبين"], ["players", "👥 اللاعبين"], ["names", "✏️ الأسماء"], ["gifts", "🎁 الهدايا"], ["announce", "📢 إعلان"], ["away", "🧾 الخصومات"]];
function frame(inner) {
  $("app").innerHTML = `<header><h1>🛠️ لوحة تحكم الجوف</h1><button id="out">خروج</button></header>
    <nav>${TABS.map(([k, t]) => `<button class="${k === tab ? "on" : ""}" data-tab="${k}">${t}</button>`).join("")}</nav><main>${inner}</main>`;
  $("out").onclick = () => { localStorage.removeItem("rafaya-admin"); token = ""; login(); };
  document.querySelectorAll("[data-tab]").forEach((b) => (b.onclick = () => { tab = b.dataset.tab; show(); }));
}
async function show() {
  if (!token) return login();
  frame(`<p class="muted">نحمّل…</p>`);
  try { await ({ home, review: reviewAccess, reports, chat, feedback, players, names, gifts, announce, away })[tab](); } catch (e) { if (e.message !== "login") frame(`<p>ما زبط: ${esc(e.message)}</p>`); }
}
async function home() {
  const s = await api("stats");
  frame(`<div class="grid">
    ${[["اللاعبين", s.players], ["المدن", s.towns], ["جدد اليوم", s.newToday], ["لعبوا اليوم", s.activeToday], ["رسايل الشات اليوم", s.chatToday], ["البلاغات", s.reports], ["محظورين", s.banned], ["جوالات فيها تنبيهات", s.pushPhones], ["آخر تنبيه وصلها ✅", s.pushOk], ["آخر تنبيه فشل ❌", s.pushFail]].map(([t, v]) => `<div class="card stat"><b>${n(v)}</b><span>${t}</span></div>`).join("")}
    </div><h3>🏆 أكبر المدن</h3>${s.biggest.map((t) => `<div class="card row"><span><b>${esc(t.town)}</b> <small>${esc(t.owner)}</small></span><span>${n(t.pop)} ساكن · ${ERAS[t.era] || ""}</span></div>`).join("")}`);
}
async function reports() {
  const { list } = await api("reports");
  frame(list.length ? list.map((r) => `<div class="card"><div class="row"><b>${esc(r.town || "مدينة محذوفة")}</b><small>${ago(r.at)}</small></div>
      <div>${esc(r.reason)}</div><small>العمدة: ${esc(r.owner || "-")} · بلّغ: ${esc(r.by)}</small>
      <div class="acts"><button class="btn" data-clear="${r.id}">✓ تم، شيله</button>${r.owner ? `<button class="btn bad" data-ban="${esc(r.owner)}">⛔ احظر العمدة</button><button class="btn" data-rename="${r.plot}" data-town="${esc(r.town)}">✏️ غيّر اسم المدينة</button>` : ""}</div></div>`).join("") : `<p class="muted">ما فيه بلاغات ✓</p>`);
  bindActs();
  document.querySelectorAll("[data-clear]").forEach((b) => (b.onclick = async () => { await api("reports", { clear: b.dataset.clear }); toast("انشال"); show(); }));
}
async function chat() {
  const { list } = await api("chat");
  frame(`<div class="card"><b>🛠️ اكتب بالشات</b><p class="muted">يطلع للكل بشات الجوف باسم «🛠️ المطور».</p><textarea id="say" maxlength="200" placeholder="اكتب رسالتك"></textarea><button class="btn go block" id="sayGo">أرسل</button></div>` +
    (list.length ? list.map((m) => `<div class="card"><div class="row"><b>${esc(m.name)}</b><small>${esc(m.town)} · ${ago(m.at)}</small></div><div>${esc(m.text)}</div>
      <div class="acts"><button class="btn" data-del="${m.id}">🗑️ امسح</button>${/^(📢|🛠️)/.test(m.name) ? "" : `<button class="btn bad" data-ban="${esc(m.name)}">⛔ احظر</button><button class="btn" data-fix="${esc(m.name)}">✏️ اطلب تغيير الاسم</button>`}</div></div>`).join("") : `<p class="muted">الشات فاضي</p>`));
  $("sayGo").onclick = async (event) => {
    const send = event.currentTarget, text = $("say").value.trim();
    if (!text) { toast("اكتب رسالة أول"); return; }
    send.disabled = true;
    try {
      const r = await api("say", { text });
      if (r.ok) { toast("انرسلت في الشات العام ✓"); if (send.isConnected) show(); }
      else toast(r.error || "ما وصلت الرسالة");
    } catch (e) { if (e.message !== "login") toast("ما وصلت الرسالة، جرّب مرة ثانية"); }
    finally { send.disabled = false; }
  };
  bindActs();
  document.querySelectorAll("[data-del]").forEach((b) => (b.onclick = async () => { await api("chat", { del: b.dataset.del }); toast("انمسحت"); show(); }));
}
async function feedback(before = 0) {
  const session = token;
  const { list, nextBefore, error } = await api(before ? "feedback?before=" + before : "feedback");
  if (tab !== "feedback" || token !== session) return;
  if (error || !list) throw new Error(error || "تعذّر تحميل الملاحظات");
  frame(`<div class="row"><h2>ملاحظات اللاعبين الخاصة</h2>
    <button class="btn" id="feedbackLatest" type="button">${before ? "أحدث الملاحظات" : "حدّث الملاحظات"}</button></div>
    ${list.map((m) => `<article class="card"><div class="row"><span><b>${esc(m.name)}</b> <small>${esc(m.town)}</small></span><small>${ago(m.at)}</small></div><p class="feedback-text" dir="auto">${esc(m.text)}</p></article>`).join("") || '<p class="muted">ما وصلت أي ملاحظات للحين.</p>'}
    ${nextBefore ? '<button class="btn block" id="feedbackOlder" type="button">ملاحظات أقدم</button>' : ""}`);
  $("feedbackLatest").onclick = () => show();
  if (nextBefore) $("feedbackOlder").onclick = async (event) => {
    const button = event.currentTarget;
    button.disabled = true;
    try { await feedback(nextBefore); }
    catch (e) { if (e.message !== "login") toast("ما قدرنا نحمّل الملاحظات الأقدم"); }
    finally { button.disabled = false; }
  };
}
async function players(q = lastQ) {
  lastQ = q;
  const { list } = await api("players?q=" + encodeURIComponent(q));
  frame(`<input id="q" placeholder="دوّر باسم اللاعب أو المدينة" value="${esc(q)}">
    ${list.map((p) => `<div class="card"><div class="row"><span><b>${esc(p.town || "بدون مدينة")}</b> <small>${esc(p.name)}</small></span>${p.banned ? `<span class="tag">محظور</span>` : ""}</div>
      <small>${p.town ? `${n(p.pop)} ساكن · ${ERAS[p.era] || ""} · ${n(p.money)} ريال · آخر دخول ${ago(p.updated)}` : "ما أسس مدينة"}${p.banned && p.ban_reason ? ` · السبب: ${esc(p.ban_reason)}` : ""}</small>
      ${p.town ? `<div><small>🔔 ${(p.phones || []).length ? p.phones.map((x) => `<span dir="ltr">${esc(x.host)}</span> · ${x.status == null ? "ما انرسل له شي للحين" : x.status >= 200 && x.status < 300 ? `✅ آخر تنبيه انقبل (${x.status}) ${ago(x.at)}` : `❌ آخر تنبيه انرفض (${x.status || "ما وصل للمزوّد"}) ${ago(x.at)}`} · اشترك ${ago(x.created)}`).join("<br>🔔 ") : "التنبيهات مو مشغّلة"}</small></div>` : ""}
      <div class="acts">${p.banned ? `<button class="btn go" data-unban="${esc(p.name)}">فك الحظر</button>` : `<button class="btn bad" data-ban="${esc(p.name)}">⛔ احظر</button>`}
      <button class="btn" data-fix="${esc(p.name)}">✏️ اطلب تغيير الاسم</button>
      ${p.plot != null ? `<button class="btn" data-stmt="${p.plot}">🧾 كشف الحساب</button>` : ""}
      ${p.plot != null ? `<button class="btn" data-gift="${p.plot}" data-town="${esc(p.town)}">🎁 هدية</button><button class="btn" data-rename="${p.plot}" data-town="${esc(p.town)}">✏️ اسم المدينة</button>` : ""}</div></div>`).join("") || `<p class="muted">ما لقيت أحد</p>`}`);
  $("q").onchange = () => players($("q").value);
  bindActs();
}
const FIX_REASONS = [["person", "اسم شخص حقيقي غير اسمه"], ["tribe", "اسم أو رمز عائلة أو فخذ أو قبيلة"], ["bad", "كلام ما يصلح"], ["fake", "يوهم إنه من الإدارة"]];
const WHAT = { both: "اسمه واسم مدينته", name: "اسمه بس", town: "اسم مدينته بس" };
const left = (due) => { const m = Math.round((due - Date.now()) / 60000); return m <= 0 ? "خلصت المهلة" : m >= 60 ? `باقي ${n(Math.floor(m / 60))} س ${n(m % 60)} د` : `باقي ${n(m)} د`; };
async function names() {
  const { list } = await api("namefix");
  frame(`<p class="muted">اللي طلبت منهم يغيرون الاسم. لازم يغيرونه خلال يوم (٢٤ ساعة)، وإذا ما غيروه تنحذف مدينتهم من عالم الجوف لحالها. تطلب من «👥 اللاعبين» أو من «💬 الشات».</p>
    ${list.length ? list.map((f) => `<div class="card"><div class="row"><span><b>${esc(f.name)}</b> <small>${esc(f.town || "بدون مدينة")}</small></span>${f.removed ? `<span class="tag">🗑️ انحذفت مدينته</span>` : `<span class="tag">⏳ ${left(f.due)}</span>`}</div>
      <small>المطلوب: ${WHAT[f.what] || ""} · ${JSON.parse(f.reasons || "[]").map((r) => (FIX_REASONS.find((x) => x[0] === r) || [, r])[1]).concat(f.note ? [f.note] : []).map(esc).join(" · ")}</small>
      <div class="acts"><button class="btn" data-unfix="${esc(f.name)}">إلغاء الطلب</button></div></div>`).join("") : `<p class="muted">ما فيه طلبات ✓</p>`}`);
  document.querySelectorAll("[data-unfix]").forEach((b) => (b.onclick = async () => { await api("namefix", { cancel: b.dataset.unfix }); toast("انلغى الطلب"); show(); }));
}
function fixForm(name) {
  const box = document.createElement("div");
  box.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:5;padding:16px";
  box.innerHTML = `<div class="card" style="max-width:420px;width:100%"><h3>✏️ اطلب من «${esc(name)}» يغيّر</h3>
    <p class="muted">يطلع له شاشة ما تتسكر لين يغيّر، ومعه مهلة يوم. إذا ما غيّر تنحذف مدينته.</p>
    <label>وش يغيّر؟ <select id="fxWhat" style="width:100%;font:inherit;padding:8px;border-radius:10px">${Object.entries(WHAT).map(([k, t]) => `<option value="${k}">${t}</option>`).join("")}</select></label>
    <p><b>السبب:</b></p>${FIX_REASONS.map(([k, t]) => `<label style="display:block;margin:6px 0"><input type="checkbox" value="${k}" style="width:auto"> ${t}</label>`).join("")}
    <textarea id="fxNote" maxlength="160" placeholder="سبب ثاني أو توضيح (اختياري)"></textarea>
    <div class="acts"><button class="btn go" id="fxGo">أرسل الطلب</button><button class="btn" id="fxNo">إلغاء</button></div></div>`;
  document.body.appendChild(box);
  box.querySelector("#fxNo").onclick = () => box.remove();
  box.querySelector("#fxGo").onclick = async () => {
    const reasons = [...box.querySelectorAll("input[type=checkbox]:checked")].map((c) => c.value);
    const r = await api("namefix", { name, what: box.querySelector("#fxWhat").value, reasons, note: box.querySelector("#fxNote").value });
    toast(r.error || "انرسل الطلب ✓ عنده يوم يغيّر"); if (!r.error) { box.remove(); show(); }
  };
}
// the town's money moves, labelled as its game labels them (js/main.js MONEY_MOVES)
const MOVES = { hour: "تشغيل المدينة (دخل وصرف الساعة)", away: "تشغيل المدينة وقت الغياب", build: "بناء", upgrade: "تطوير", materials: "شراء مواد بناء", land: "شراء أرض", fill: "ردم الوادي", rock: "إزالة صخر", move: "نقل مبنى", remove: "مبلغ رجع من إزالة مبنى", repair: "ترميم", insurance: "تعويض التأمين", shield: "درع الغياب سدّد الدين", loan: "مبلغ قرض", payoff: "سداد قرض", research: "بحث", decision: "قرار البلدية", investment: "عائد استثمار", goal: "مكافأة مهمة", election: "دعم الانتخابات", grant: "دعم المحافظ", fee: "رسوم المحافظة السنوية", cleaning: "تنظيف الطرق", gift: "هدية من الإدارة", refund: "مبلغ رجّعته الإدارة", worldBill: "عملية في عالم الجوف (حرب، إصلاح، شراء)", transfer: "تحويل بين المدن", awayLimit: "خصم كسب الغياب الزايد", idleLimit: "كسب فوق حد الخمول", idleCover: "تغطية مصروف من كسب الخمول" };
const COSTS = { staff: "رواتب البلدية", cleaning: "النظافة", waterNet: "شبكة الماء", roads: "الطرق والإنارة", services: "الخدمات", utilities: "تشغيل الماء والكهرباء", business: "تشغيل المحلات والمزارع والمصانع", military: "القوة العسكرية", sites: "مواقع الإنشاء", loan: "أقساط القروض", insurance: "التأمين", health: "علاج التلوث", theft: "سرقات" };
const signed = (v) => `<span class="${v > 0 ? "plus" : v < 0 ? "minus" : ""}" dir="ltr">${v > 0 ? "+" : v < 0 ? "−" : ""}${n(Math.abs(Math.round(v)))}</span>`;
const when = (at) => new Date(at).toLocaleString("ar-SA", { dateStyle: "medium", timeStyle: "short" });
async function reviewAccess() {
  const session = token;
  const result = await api("review-access");
  if (tab !== "review" || token !== session) return;
  if (result.error) throw new Error(result.error);
  renderReviewAccess(result);
}
function renderReviewAccess({ configured, enabled }) {
  frame(`<h2>وصول للمراجعة</h2>
    <div class="card">
      <p>هوية المراجعة المربوطة تشوف قوائم الإدارة وكشوف الحساب وملاحظات اللاعبين للقراءة فقط.</p>
      <p class="muted" role="status">${enabled ? "وصول المراجعة فعّال." : configured ? "وصول المراجعة متوقف." : "هوية المراجعة غير مربوطة."}</p>
      ${configured ? `<button class="btn ${enabled ? "bad" : "go"}" id="toggleReview" type="button">${enabled ? "أوقف وصول المراجعة" : "فعّل وصول المراجعة"}</button>` : ""}
    </div>`);
  const button = $("toggleReview");
  if (!button) return;
  button.onclick = async () => {
    button.disabled = true;
    try {
      const result = await api("review-access", { action: enabled ? "revoke" : "enable" });
      if (result.error) { toast(result.error); return; }
      if (button.isConnected) renderReviewAccess(result);
    } catch (e) {
      if (e.message !== "login") toast("ما قدرنا نغيّر وصول المراجعة. جرّب مرة ثانية.");
    } finally {
      button.disabled = false;
    }
  };
}
async function statement(plot) {
  const d = await api("statement?plot=" + plot);
  if (d.error) { toast(d.error); return; }
  const L = d.ledger, log = (L?.log || []).slice().reverse();
  const dayOf = (h) => Math.max(1, Math.floor((h - (L?.start ?? 0) + 2) / 24) + 1);
  const sum = (f) => log.filter(f).reduce((t, e) => t + e.amount, 0);
  const inSum = sum((e) => e.amount > 0), outSum = sum((e) => e.amount < 0);
  const byKind = {}; for (const e of log) (byKind[e.kind] ||= 0), (byKind[e.kind] += e.amount);
  const box = $("stmt");
  box.innerHTML = `<div class="noprint acts"><button class="btn go" onclick="print()">🖨️ اطبع</button><button class="btn" onclick="document.getElementById('stmt').style.display='none'">✕ سكّر</button></div>
    <h2>🧾 كشف حساب «${esc(d.town)}»</h2><p class="muted">العمدة: ${esc(d.owner)} · ${n(d.pop)} ساكن · آخر دخول ${when(d.updated)} · طُبع ${when(Date.now())}</p>
    <div class="card"><b>الرصيد الحين: ${signed(d.money)} ريال</b>${d.money < 0 ? `<br><small class="minus">الحساب بالسالب</small>` : ""}</div>
    ${L?.hour ? `<h3>الساعة الواحدة باللعبة (آخر ما شافه السيرفر)</h3><table><tr><th>البند</th><th>المبلغ</th></tr>
      <tr><td>ضريبة الأهالي</td><td>${signed(L.hour.tax)}</td></tr><tr><td>المحلات</td><td>${signed(L.hour.shops)}</td></tr><tr><td>المزارع والمصانع</td><td>${signed(L.hour.farms)}</td></tr>
      ${Object.entries(L.hour.costs || {}).filter(([, v]) => v > 0).map(([k, v]) => `<tr><td>${COSTS[k] || k}</td><td>${signed(-v)}</td></tr>`).join("")}
      <tr><th>الصافي بالساعة</th><th>${signed(L.hour.net)}</th></tr></table>` : ""}
    ${log.length ? `<h3>ملخص آخر الحركات</h3><table><tr><th>النوع</th><th>المجموع</th></tr>${Object.entries(byKind).sort((a, b) => a[1] - b[1]).map(([k, v]) => `<tr><td>${MOVES[k] || k}</td><td>${signed(v)}</td></tr>`).join("")}
      <tr><th>دخل</th><th>${signed(inSum)}</th></tr><tr><th>صرف</th><th>${signed(outSum)}</th></tr></table>
      <h3>كل الحركات (الأحدث فوق، آخر ${n(log.length)} حركة)</h3><table><tr><th>يوم</th><th>الحركة</th><th>التفصيل</th><th>المبلغ</th></tr>
      ${log.map((e) => `<tr><td>${n(dayOf(e.day))}</td><td>${MOVES[e.kind] || esc(e.kind)}</td><td>${e.operating ? `دخل ${n(e.operating.income)} · صرف ${n(e.operating.expenses)}${e.operating.limited ? ` · الخزنة حدّت ${n(e.operating.limited)}` : ""}` : esc(e.detail || "")}</td><td>${signed(e.amount)}</td></tr>`).join("")}</table>`
      : `<div class="card">سجل حركات جواله ما وصل للسيرفر للحين: يوصل أول ما يدخل اللعبة بالتحديث الجديد (خلال دقيقتين من لعبه).</div>`}
    <h3>اللي سجله السيرفر عليه (حرب، هدايا، تصحيحات)</h3>${d.charges.length ? `<table><tr><th>الوقت</th><th>السبب</th><th>المبلغ</th></tr>${d.charges.map((c) => `<tr><td>${when(c.at)}</td><td>${esc(c.why === "gift" ? "هدية من الإدارة" : c.why === "away cap" ? "تصحيح كسب الغياب" : c.why === "refund" ? "مبلغ رجّعته الإدارة" : c.why)}</td><td>${signed(-c.amount)}</td></tr>`).join("")}</table>` : `<p class="muted">ما فيه شي.</p>`}
    ${d.away.length ? `<h3>تصحيحات كسب الغياب</h3><table><tr><th>الوقت</th><th>كان</th><th>رجع بـ</th><th>الحد</th><th>انخصم</th></tr>${d.away.map((a) => `<tr><td>${when(a.at)}</td><td>${n(a.before)}</td><td>${n(a.after)}</td><td>${n(a.cap)}</td><td>${signed(-a.taken)}</td></tr>`).join("")}</table>` : ""}`;
  box.style.display = "block"; box.scrollTop = 0;
}
async function gifts() {
  const { list } = await api("gifts");
  frame(`<p class="muted">الهدية تدخل فلوسهم أول ما يكون داخل عالم الجوف (لو كان برا، تدخل أول ما يرجع).</p>
    ${list.length ? list.map((g) => `<div class="card row"><span><b>${esc(g.town)}</b> <small>${esc(g.owner)}</small><br><small>${ago(g.at)}</small></span><span><b>+${n(g.amount)}</b> ${g.arrived ? `<span class="tag ok">✅ وصلت</span>` : `<span class="tag">⏳ لسه ما دخل الجوف</span>`}</span></div>`).join("") : `<p class="muted">ما أرسلت هدايا للحين. ترسلها من «👥 اللاعبين».</p>`}`);
}
async function announce() {
  frame(`<div class="card"><h3>📢 إعلان للكل</h3><p class="muted">يطلع بنشرة الجوف وبالشات باسم «الإدارة».</p>
    <textarea id="ann" maxlength="200" placeholder="مثلاً: الليلة الساعة ٩ مسابقة أجمل مدينة 🏆"></textarea><button class="btn go block" id="annGo">أرسل الإعلان</button></div>`);
  $("annGo").onclick = async () => { const r = await api("announce", { text: $("ann").value }); toast(r.error || "انرسل ✓"); if (!r.error) $("ann").value = ""; };
}
async function away() {
  frame(`<p>الخصومات اللي صارت على اللي كسبوا وهم برا أكثر من الحد، والفلوس اللي رجعت:</p><a class="btn go block" style="display:block;text-align:center;text-decoration:none" href="/api/world/awayfix?view=page" target="_blank">افتح صفحة الخصومات</a>`);
}
function bindActs() {
  document.querySelectorAll("[data-ban]").forEach((b) => (b.onclick = async () => {
    const reason = prompt(`ليش تحظر «${b.dataset.ban}»؟ (يطلع لك أنت بس)`, "كلام مسيء");
    if (reason === null) return;
    const r = await api("ban", { name: b.dataset.ban, on: true, reason }); toast(r.error || "انحظر ⛔"); show();
  }));
  document.querySelectorAll("[data-unban]").forEach((b) => (b.onclick = async () => { const r = await api("ban", { name: b.dataset.unban, on: false }); toast(r.error || "انفك الحظر ✓"); show(); }));
  document.querySelectorAll("[data-gift]").forEach((b) => (b.onclick = async () => {
    const amount = Number(prompt(`كم تبي تهدي «${b.dataset.town}»؟ (ريال)`, "5000"));
    if (!amount) return;
    const text = prompt("رسالة معها (اختياري)", "شكرًا على مشاركتك 🌹") || "";
    const r = await api("gift", { plot: b.dataset.gift, amount, text }); toast(r.error || `وصلت الهدية لـ«${r.town}» 🎁`);
  }));
  document.querySelectorAll("[data-stmt]").forEach((b) => (b.onclick = () => statement(b.dataset.stmt)));
  document.querySelectorAll("[data-fix]").forEach((b) => (b.onclick = () => fixForm(b.dataset.fix)));
  document.querySelectorAll("[data-rename]").forEach((b) => (b.onclick = async () => {
    const town = prompt(`الاسم الجديد بدل «${b.dataset.town}»`, "");
    if (!town) return;
    const r = await api("rename", { plot: b.dataset.rename, town }); toast(r.error || "تغيّر الاسم ✓"); show();
  }));
}
show();
</script>
</body>
</html>
