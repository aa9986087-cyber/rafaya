<title>الرافعية · تحت الصيانة</title>

<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { display: grid; place-items: center; padding: 24px 16px; background: radial-gradient(circle at 50% 35%, #4a331e, #1f150c 70%); color: #fbf3e2; font: 500 17px/1.7 "Tajawal", system-ui, sans-serif; text-align: center; }
  main { max-width: 420px; display: grid; gap: 10px; justify-items: center; }
  h1 { margin: 0; font: 700 clamp(64px, 18vw, 96px)/1.15 "Aref Ruqaa", serif; color: #f3cf7a; }
  .badge { display: inline-block; padding: 4px 14px; border-radius: 99px; background: rgba(243, 207, 122, .15); color: #f3cf7a; font-weight: 700; font-size: 15px; }
  p { margin: 0; color: rgba(251, 243, 226, .85); }
  .note { font-size: 14px; color: rgba(251, 243, 226, .6); }
  .gear { width: 54px; height: 54px; animation: spin 6s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .gear { animation: none; } }
</style>
</head>

<main>
